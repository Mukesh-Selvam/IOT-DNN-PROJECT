<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" style="background:#090912; font-family:system-ui, sans-serif;">
  <defs>
    <linearGradient id="gradTN" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="gradTP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="gradErr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="300" y="45" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle">DNN Crash Classifier — Confusion Matrix</text>
  <text x="300" y="68" fill="#64748b" font-size="12" text-anchor="middle">Evaluated on N=144 Independent Test Windows (Split by Run-ID)</text>

  <!-- Axis labels -->
  <text x="365" y="105" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">Predicted: Non-Accident</text>
  <text x="495" y="105" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">Predicted: Accident</text>

  <text x="130" y="195" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="end">Actual: Normal</text>
  <text x="130" y="325" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="end">Actual: Accident</text>

  <!-- Cell 1: True Negative (Normal -> Normal) -->
  <rect x="300" y="130" width="130" height="130" rx="12" fill="url(#gradTN)" stroke="#10b981" stroke-width="1.5"/>
  <text x="365" y="185" fill="#34d399" font-size="28" font-weight="800" text-anchor="middle">107</text>
  <text x="365" y="210" fill="#a7f3d0" font-size="11" font-weight="500" text-anchor="middle">True Negatives</text>
  <text x="365" y="230" fill="#6ee7b7" font-size="10" text-anchor="middle">100% Specificity</text>

  <!-- Cell 2: False Positive (Normal -> Accident) -->
  <rect x="440" y="130" width="130" height="130" rx="12" fill="url(#gradErr)" stroke="#f43f5e" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="505" y="185" fill="#64748b" font-size="28" font-weight="800" text-anchor="middle">0</text>
  <text x="505" y="210" fill="#fda4af" font-size="11" font-weight="500" text-anchor="middle">False Alarms</text>
  <text x="505" y="230" fill="#94a3b8" font-size="10" text-anchor="middle">0% False Alarm Rate</text>

  <!-- Cell 3: False Negative (Accident -> Normal) -->
  <rect x="300" y="270" width="130" height="130" rx="12" fill="url(#gradErr)" stroke="#f43f5e" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="365" y="325" fill="#64748b" font-size="28" font-weight="800" text-anchor="middle">0</text>
  <text x="365" y="350" fill="#fda4af" font-size="11" font-weight="500" text-anchor="middle">Missed Crashes</text>
  <text x="365" y="370" fill="#94a3b8" font-size="10" text-anchor="middle">0% Miss Rate</text>

  <!-- Cell 4: True Positive (Accident -> Accident) -->
  <rect x="440" y="270" width="130" height="130" rx="12" fill="url(#gradTP)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="505" y="325" fill="#818cf8" font-size="28" font-weight="800" text-anchor="middle">37</text>
  <text x="505" y="350" fill="#c7d2fe" font-size="11" font-weight="500" text-anchor="middle">True Positives</text>
  <text x="505" y="370" fill="#a5b4fc" font-size="10" text-anchor="middle">100% Target Recall</text>

  <!-- Summary Footer -->
  <rect x="50" y="415" width="500" height="25" rx="6" fill="#1e1e38"/>
  <text x="300" y="432" fill="#94a3b8" font-size="11" text-anchor="middle">Accuracy: 100% · Precision: 100% · Recall: 100% · F1-Score: 1.00</text>
</svg>